name: Build Dibs APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Unpack the project
        run: unzip -q dibs-android.zip
      - name: Install dependencies
        working-directory: dibs-app
        run: npm ci
      - name: Copy the web app into the Android project
        working-directory: dibs-app
        run: npx cap sync android
      - name: Build debug APK
        working-directory: dibs-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Dibs-apk
          path: dibs-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
